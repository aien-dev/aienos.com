[package]
name = "site-builder"
version = "0.1.0"
edition = "2021"
description = "Pure native Rust static site generator for aienos.com"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
maud = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"

[dev-dependencies]
sha2 = "0.10"
