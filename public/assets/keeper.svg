<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title desc">
  <title id="title">Keeper, the merge desk</title>
  <desc id="desc">Three queued streams of light curve in from the left, pass through a copper aperture, and leave as one settled line with three merged nodes. Nothing is boxed; the whole figure is drawn from flowing arcs.</desc>
  <defs>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a4adbb" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#eee5d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d6aa7a" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="settled" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6aa7a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#eee5d4" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d6aa7a" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#c88e4b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c88e4b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .queue { fill:none; stroke:url(#stream); stroke-width:1.6; stroke-linecap:round; }
      .queue--b { stroke-width:2.2; }
      .settled { fill:none; stroke:url(#settled); stroke-width:2; stroke-linecap:round; stroke-dasharray:3 7; animation:carry 9s linear infinite; }
      .gate { fill:none; stroke:#d6aa7a; stroke-width:1.8; }
      .gate-core { fill:none; stroke:#eee5d4; stroke-width:1; opacity:.7; }
      .glow { fill:url(#halo); }
      .node { fill:#eee5d4; opacity:.85; }
      .node--warm { fill:#d6aa7a; }
      .base { stroke:#3a3630; stroke-width:1; }
      .tick { stroke:#4a453e; stroke-width:1; }
      .pulse { transform-origin:300px 120px; animation:breathe 6s ease-in-out infinite; }
      .flicker { animation:flicker 7s ease-in-out infinite; }
      .flicker--2 { animation-delay:-2.5s; }
      .flicker--3 { animation-delay:-4.5s; }
      @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes flicker { 0%,100% { opacity:.45; } 50% { opacity:.9; } }
      @keyframes carry { to { stroke-dashoffset:-20; } }
      @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
    </style>
  </defs>

  <ellipse class="glow pulse" cx="300" cy="120" rx="96" ry="82"/>

  <path class="queue flicker flicker--2" d="M36 78 C132 78 206 112 296 119"/>
  <path class="queue queue--b" d="M36 120 C120 120 214 120 296 120"/>
  <path class="queue flicker flicker--3" d="M36 162 C132 162 206 128 296 121"/>

  <path class="gate pulse" d="M300 62 C346 90 346 150 300 178 C254 150 254 90 300 62 Z"/>
  <path class="gate-core" d="M300 86 C328 106 328 134 300 154 C272 134 272 106 300 86 Z"/>
  <circle cx="300" cy="120" r="4.2" fill="#eee5d4"/>
  <circle cx="300" cy="120" r="10.5" fill="none" stroke="#d6aa7a" stroke-width="1" opacity=".6"/>

  <path class="settled" d="M304 120 C400 120 470 100 560 96"/>
  <circle class="node" cx="392" cy="116" r="3"/>
  <circle class="node node--warm" cx="452" cy="108" r="3.4"/>
  <circle class="node" cx="522" cy="99" r="4"/>

  <line class="base" x1="44" y1="178" x2="556" y2="178"/>
  <g class="tick">
    <line x1="92" y1="178" x2="92" y2="184"/>
    <line x1="164" y1="178" x2="164" y2="184"/>
    <line x1="236" y1="178" x2="236" y2="184"/>
    <line x1="364" y1="178" x2="364" y2="184"/>
    <line x1="436" y1="178" x2="436" y2="184"/>
    <line x1="508" y1="178" x2="508" y2="184"/>
  </g>
</svg>
