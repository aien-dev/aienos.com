name: Generated Aien artifacts
on:
  pull_request:
    paths:
      - 'om/allen-page/**'
      - 'public/js/allen.js'
      - 'public/assets/allen.css'
      - 'public/js/aien-speed.js'
      - 'public/assets/aien-speed.css'
      - 'crates/site-builder/**'
      - '.github/workflows/generated-allen.yml'
  push:
    branches: [main]
    paths:
      - 'om/allen-page/**'
      - 'public/js/allen.js'
      - 'public/assets/allen.css'
      - 'public/js/aien-speed.js'
      - 'public/assets/aien-speed.css'
      - 'crates/site-builder/**'
      - '.github/workflows/generated-allen.yml'
permissions:
  contents: read
jobs:
  artifact-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # These tests only hash committed bytes; never execute the arm64 omc pin.
      - name: Check generated skeleton
        run: cargo test --manifest-path crates/site-builder/Cargo.toml components::allen::tests::the_embedded_skeleton_matches_its_recorded_sha256 -- --exact
      - name: Check generated browser script
        run: cargo test --manifest-path crates/site-builder/Cargo.toml components::allen::tests::the_served_script_matches_its_omega_generated_sha256 -- --exact
      - name: Check generated speed-test component
        run: cargo test --manifest-path crates/site-builder/Cargo.toml components::speed::tests -- --test-threads=1
