name: pages
on:
  workflow_dispatch:
  schedule:
    # Once a day, so the facts on the page stay current without anyone touching the site.
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh facts from the public GitHub record
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- facts facts.json
      - name: Run the builder's tests
        run: cargo test --manifest-path crates/site-builder/Cargo.toml
      - name: Build and verify the page
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- build dist facts.json
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
