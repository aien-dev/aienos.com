name: pages
# Builds and deploys www.aienos.com. No tests run on GitHub-hosted runners (2026-10-18):
# site-builder tests run on the Spark, and pull requests get no hosted build.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public project history
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- progress public/data/project-progress.json
      - name: Refresh facts from the public GitHub record
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- facts facts.json
      - name: Build static site with pure Rust engine
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- build dist
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
