name: pages
# Builds and deploys www.aienos.com. The full site-builder suite runs on Spark;
# generated-hive.yml separately checks committed Hive artifact hashes on x86_64,
# and the committed Hive skeleton digest is checked again before publication.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main, data/now]
permissions:
  contents: read
concurrency:
  group: pages
  # Let the active build finish; newer data can replace the pending run.
  cancel-in-progress: false
jobs:
  build:
    # The seeded Omega compiler emits Linux AArch64 executables, so the site
    # builds on GitHub's arm64 runner. The Rust crate remains the independent
    # verification oracle and the public-data collectors (DEPENDENCIES.md).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          # Full history: the sitemap and feeds date hand-written pages from their last commit.
          fetch-depth: 0
      - name: Lay in the live ledger from the data/now branch
        run: |
          set -euo pipefail
          mkdir -p public/data
          if git fetch --depth 1 origin data/now 2>/dev/null; then
            git show FETCH_HEAD:now.tsv > public/data/now.tsv
            git show FETCH_HEAD:now-pulse.tsv > public/data/now-pulse.tsv || true
            # A missing model check stays absent; the page then says status unknown.
            if git cat-file -e FETCH_HEAD:models.tsv 2>/dev/null; then
              git show FETCH_HEAD:models.tsv > public/data/models.tsv
            else
              rm -f public/data/models.tsv
            fi
            # The Claude plan reading is optional too; without it the page says none was published.
            if git cat-file -e FETCH_HEAD:claude-usage.tsv 2>/dev/null; then
              git show FETCH_HEAD:claude-usage.tsv > public/data/claude-usage.tsv
            else
              rm -f public/data/claude-usage.tsv
            fi
            # /dash/ readings are optional; a missing file makes the page say so.
            for f in accounts.tsv routing.tsv; do
              if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
                git show "FETCH_HEAD:$f" > "public/data/$f"
              else
                rm -f "public/data/$f"
              fi
            done
            echo "ledger: $(wc -l < public/data/now.tsv) lines"
          else
            echo "no data/now branch yet; /now/ renders empty"
          fi
      - name: Refuse an unprojected public ledger (Rust oracle)
        run: cargo run --release -p site-builder -- ledger-check public/data/now.tsv
      # The collector walks the public GitHub record; a slow or rate-limited
      # API must not hold the whole deploy (it did twice on 2026-10-25). It is
      # bounded, written to a temp file, and the committed file stays in place
      # when it does not finish.
      - name: Collect public project history
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if timeout 240 cargo run --release --manifest-path crates/site-builder/Cargo.toml -- progress "$tmp"; then
            mv "$tmp" public/data/project-progress.json
            echo "progress: collected"
          else
            rm -f "$tmp"
            echo "progress: collector timed out or failed; keeping the committed project-progress.json"
          fi
      - name: Refresh facts from the public GitHub record
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- facts facts.json
      # /agents/ lists every public repository and its AGENTS.md. Same rule as
      # the progress collector: bounded, and the committed list stays in place
      # when GitHub does not answer.
      - name: Refresh the agent repository list
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          if timeout 120 cargo run --release --manifest-path crates/site-builder/Cargo.toml -- agents "$tmp"; then
            mv "$tmp" public/data/agent-repos.json
          else
            rm -f "$tmp"
            echo "agents: collector timed out or failed; keeping the committed agent-repos.json"
          fi
      - name: Check the committed Omega artifact digests
        run: |
          set -euo pipefail
          sha256sum -c om/site/omc.sha256
          cargo test --release -p site-builder the_embedded_skeleton_matches_its_recorded_sha256
          cargo test --release -p site-builder components::alpha::tests
          sha256sum -c om/support-page/main.html.sha256 om/support-page/entry.html.sha256 om/support-page/support.css.sha256
      - name: Compile the Omega site generator and verifier
        run: |
          set -euo pipefail
          mkdir -p build
          om/site/omc < om/site/build.om > build/build-tool
          chmod +x build/build-tool
          build/build-tool om/site/modules.txt build/site
          build/build-tool om/site/verify.manifest build/verify
      - name: Validate the source data (Omega)
        run: build/verify --sources
      - name: Generate the site with Omega
        run: build/site "$PWD" "$PWD/dist" "$(git log -1 --format=%cI)"
      - name: Verify the output (Omega verifier)
        run: build/verify dist data/quotes.json public/data/engineer.json
      - name: Verify the output (independent Rust oracle)
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- verify dist
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/data/now'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/data/now'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
