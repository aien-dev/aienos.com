name: HiveChat temporary verify
# Temporary: runs the Spark-side suite on a GitHub arm64 runner while the Spark is loaded.
# Removed before merge.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lay in the live ledger from the data/now branch
        run: |
          set -euo pipefail
          mkdir -p public/data
          git fetch --depth 1 origin data/now
          for f in now.tsv now-pulse.tsv models.tsv claude-usage.tsv accounts.tsv routing.tsv; do
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then git show "FETCH_HEAD:$f" > "public/data/$f"; fi
          done
      - name: Hive verify chain
        run: sh om/hive-render/verify.sh
      - name: Full hive-feed suite
        run: cargo test -p hive-feed
      - name: Build static site
        run: cargo run --release -p site-builder -- build dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 3
