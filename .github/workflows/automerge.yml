name: automerge

# Opt-in merging (hive rule 2026-10-01): nothing merges without an inspector verdict.
# This workflow now runs only when started by hand (workflow_dispatch) for a named
# branch; it no longer fires on every push. Former behavior: any push to a non-main branch got built, got a PR
# opened against main if none exists, and is merged once the build passes.
# This keeps work flowing to main instead of leaving branches unmerged.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to build and merge (only after an inspector VERDICT merge)"
        required: true

permissions:
  contents: write
  pull-requests: write

# Serialize merges into main so concurrent branch pushes can't race.
concurrency:
  group: automerge-main
  cancel-in-progress: false

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Run verification test suite
        run: cargo test --verbose --manifest-path crates/site-builder/Cargo.toml
      - name: Build static site with pure Rust engine
        run: cargo run --release --manifest-path crates/site-builder/Cargo.toml -- build dist
      - name: Open PR and merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --base main --head "$BRANCH" \
              --title "Auto-merge: $BRANCH" \
              --body "Opened automatically by the automerge pipeline after a successful build of \`$BRANCH\`.")"
            PR_NUMBER="${PR_URL##*/}"
            echo "Opened PR #$PR_NUMBER ($PR_URL)"
          else
            echo "Found existing PR #$PR_NUMBER"
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Merged PR #$PR_NUMBER into main"
