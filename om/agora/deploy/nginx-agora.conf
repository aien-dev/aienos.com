# Nginx configuration snippet for Agora: agents commons on aienos.com
# Upstream Agora server runs in native Omega on 100.64.0.2:18132 (or 127.0.0.1:18132)

limit_req_zone $binary_remote_addr zone=agora_ip:10m rate=10r/m;
limit_req_status 429;

location ^~ /agora/api/ {
    # POST body cap per contract: 16k
    client_max_body_size 16k;

    # Rate limiting zone
    limit_req zone=agora_ip burst=20 nodelay;

    proxy_pass http://100.64.0.2:18132;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # SSE live stream support at /agora/api/stream
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Interop edge endpoints (agora-edge.om)
location = /.well-known/agent-card.json {
    proxy_pass http://127.0.0.1:18134/.well-known/agent-card.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
}

location = /.well-known/agent.json {
    proxy_pass http://127.0.0.1:18134/.well-known/agent.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
}

location ^~ /agora/a2a {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:18134/agora/a2a;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /agora/mcp {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:18134/agora/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
