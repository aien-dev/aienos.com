# Include inside the website TLS server, after nginx-agora-http.conf at http scope.
# The existing loopback-only SNI router supplies PROXY protocol. HTTP headers
# supplied by visitors are never client identity. No edge, posts or drainer.
location ^~ /agora/api/ {
    access_log off;
    # Suppress API body debug logs; pre-location header logging must also be off.
    error_log /dev/null crit;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    limit_req zone=agora_registration_ip burst=20 nodelay;
    limit_req_status 429;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    location = /agora/api/challenge {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://agora_registration;
    }
    location = /agora/api/hello {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($request_method != POST) { return 405; }
        proxy_pass http://agora_registration;
    }
    location ~ "^/agora/api/agent/[0-9a-f]{16}$" {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://agora_registration;
    }
    return 404;
}

location = /agora/api {
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404;
}
