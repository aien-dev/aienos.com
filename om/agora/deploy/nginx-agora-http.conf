# Include at nginx http scope, not inside a server/location.
# Keep the existing SNI router and loopback-only PROXY listener unchanged.
limit_req_zone $proxy_protocol_addr zone=agora_registration_ip:10m rate=10r/m;
upstream agora_registration {
    # This root-owned, host-local file contains only the reviewed server line.
    include /etc/nginx/snippets/agora-upstream.conf;
}
