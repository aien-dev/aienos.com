# Include inside the existing www.aienos.com TLS server, not the SNI router.
# Only this exact file is public; the directory and incoming files are not.
location = /hive/live.json {
    alias /var/www/aienos-hive/live.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    access_log off;
}

# Edge-generated document only: never expose scratch files or a directory index.
# No scripts or consent pixel on this no-JavaScript route. A file alias on a
# URI ending in "/" makes nginx's index module look for board.htmlindex.html
# (500 on hub, 2026-10-26); serve the one file through try_files instead.
location = /hive/board/ {
    root /var/www/aienos-hive;
    try_files /board.html =404;
    default_type text/html;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; frame-ancestors 'none'; form-action 'none'" always;
    access_log off;
}
