# Host-side edge rule. Installed on the hub nginx as
# /etc/nginx/snippets/aienos-install-redirect.conf and included inside the
# www.aienos.com server block of /etc/nginx/sites-enabled/aienos.com.
#
# Installs are driven through GitHub (Drake, 2026-10-26): this site serves no
# install script. The old https://aienos.com/install.sh address answers with a
# permanent redirect to the install section of the public repo, where the
# script is read and run from a git clone. Piping the redirected page into a
# shell runs nothing: the first line sh parses is HTML and it stops with a
# syntax error.
location = /install.sh {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    return 301 https://github.com/aien-dev/sovereign-intelligence#install;
}
