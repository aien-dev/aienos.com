# INTERIM host-side edge rule. Installed on the hub nginx as
# /etc/nginx/snippets/aienos-om-text.conf and included inside the
# www.aienos.com server block of /etc/nginx/sites-enabled/aienos.com.
#
# GitHub Pages types an unknown .om extension as application/octet-stream, so a
# browser saves Omega source as a binary file nothing opens. This rule makes
# every served .om plain UTF-8 text, the same as the Aien chat page's
# <name>.om.txt download.
#
# Successor: the Omega page generators (om/alpha-page/page.om and any later
# page that serves source) emit a <name>.om.txt twin beside each served .om,
# which Pages already types as text/plain; then this rule and its include go.
location ~ \.om$ {
    proxy_pass https://aienos_github_pages;
    proxy_http_version 1.1;
    proxy_set_header Host www.aienos.com;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_name www.aienos.com;
    proxy_redirect off;
    proxy_hide_header Content-Type;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
}
