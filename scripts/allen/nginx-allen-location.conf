# /etc/nginx/snippets/aienos-allen.conf - included inside the www.aienos.com
# TLS server. Only the exact routes below reach the gateway; nothing under
# /allen/api/ is logged (no addresses, no paths). Requests that did not arrive
# through the PROXY-protocol listener (empty $proxy_protocol_addr) are refused,
# because nginx does not count empty limiter keys.
location ^~ /allen/api/ {
    access_log off;
    error_page 429 = @allen_rate;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /allen/api/chat {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($allen_xsite) { return 403; }
        if ($allen_notjson) { return 415; }
        limit_except POST { deny all; }
        limit_req zone=allen_chat burst=4 nodelay;
        limit_conn allen_conn 4;
        client_max_body_size 72k;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
        gzip off;
    }

    location = /allen/api/omega {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($allen_xsite) { return 403; }
        if ($allen_notjson) { return 415; }
        limit_except POST { deny all; }
        limit_req zone=allen_omega burst=6 nodelay;
        limit_conn allen_conn 4;
        client_max_body_size 24k;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Visitor-confirmed issue/project proposals, consented introductions, deletions.
    location ~ ^/allen/api/(submit|introduce|forget|forget-me)$ {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($allen_xsite) { return 403; }
        if ($allen_notjson) { return 415; }
        limit_except POST { deny all; }
        limit_req zone=allen_submit burst=3 nodelay;
        limit_conn allen_conn 4;
        client_max_body_size 300k;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Reaching Drake (relay, handoff, say) and a key holder's project summary sync.
    location ~ ^/allen/api/(relay|handoff|say|project-summary)$ {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($allen_xsite) { return 403; }
        if ($allen_notjson) { return 415; }
        limit_except POST { deny all; }
        limit_req zone=allen_submit burst=3 nodelay;
        limit_conn allen_conn 4;
        client_max_body_size 72k;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Push-to-talk: one short raw audio clip (audio/webm, audio/ogg or audio/wav), transcribed
    # on the Spark's CPU. Same rate as chat, own zone, so a voice turn does not spend chat budget.
    location = /allen/api/transcribe {
        if ($proxy_protocol_addr = "") { return 503; }
        if ($allen_xsite) { return 403; }
        limit_except POST { deny all; }
        limit_req zone=allen_voice burst=4 nodelay;
        limit_conn allen_conn 4;
        client_max_body_size 1m;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location = /allen/api/presence {
        if ($proxy_protocol_addr = "") { return 503; }
        limit_except GET { deny all; }
        limit_req zone=allen_api burst=20 nodelay;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # The live session channel (SSE): unbuffered, held up to an hour (heartbeat every 15 s).
    location = /allen/api/session {
        if ($proxy_protocol_addr = "") { return 503; }
        limit_except GET { deny all; }
        limit_req zone=allen_api burst=10 nodelay;
        limit_conn allen_conn 4;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 1h;
        gzip off;
    }

    # Drake's console (100.64.0.2:18112) is never proxied: no route here reaches it.

    location ~ "^/allen/api/status/[0-9a-f]{20}$" {
        if ($proxy_protocol_addr = "") { return 503; }
        limit_except GET { deny all; }
        limit_req zone=allen_api burst=20 nodelay;
        proxy_pass http://allen_chat_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host allen-chat;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    return 404;
}

location = /allen/api {
    access_log off;
    return 404;
}

# Edge rate-limit refusals answer in the gateway's JSON shape.
location @allen_rate {
    access_log off;
    default_type application/json;
    add_header Retry-After 20 always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    return 429 '{"error":"rate","message":"You are sending requests quickly. Try again shortly.","retry_after":20}';
}
