# /etc/nginx/conf.d/aienos-allen.conf (http context) - public Allen chat.
# Keys are the visitor address from the PROXY protocol header that the :443
# stream router adds for www.aienos.com only. $remote_addr stays 127.0.0.1 for
# the rest of the site, so the site's own access log is unchanged.
limit_req_zone  $proxy_protocol_addr zone=allen_chat:10m  rate=6r/m;
limit_req_zone  $proxy_protocol_addr zone=allen_omega:10m rate=12r/m;
limit_req_zone  $proxy_protocol_addr zone=allen_api:10m   rate=60r/m;
limit_req_zone  $proxy_protocol_addr zone=allen_submit:10m rate=6r/m;
limit_req_zone  $proxy_protocol_addr zone=allen_voice:10m rate=6r/m;
limit_req_zone  $proxy_protocol_addr zone=allen_infer:10m rate=12r/m;
limit_conn_zone $proxy_protocol_addr zone=allen_conn:10m;

# Cross-site gate for every POST route (security survey F1; the gateway applies the same rule).
# Origin must be the site's own; no Origin is allowed only without Sec-Fetch-Site too (a
# server-side client such as the X bot; every browser sends Origin on POST).
map "$http_origin|$http_sec_fetch_site" $allen_xsite {
    default                              1;
    "~^https://(www\.)?aienos\.com\|"    0;
    "|"                                  0;
}
# JSON bodies only, so a cross-site "simple" request (text/plain, form) never reaches the gateway.
map $content_type $allen_notjson {
    default                              1;
    "~*^application/json[ \t]*(;|$)"     0;
}
# The A2A location also accepts application/a2a+json. $allen_notjson stays
# application/json only, so chat and introduce do not take that media type.
map $content_type $allen_a2a_notjson {
    default                                  1;
    "~*^application/json[ \t]*(;|$)"         0;
    "~*^application/a2a\\+json[ \t]*(;|$)"   0;
}

# The gateway listens only on the Spark's tailnet address.
upstream allen_chat_gateway {
    server 100.64.0.2:18110 max_fails=0;
    keepalive 4;
}
